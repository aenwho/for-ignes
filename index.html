<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Here lies your Wife</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #111;

            color:
                #fff;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow-x:
                hidden;

            transition:
                background .4s ease,
                color .4s ease;
        }


        /* =====================================================
           LIGHT MODE
        ===================================================== */

        body.light-mode {

            background:
                #f1f1f1;

            color:
                #171717;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .container {

            width:
                min(1250px, 96vw);

            padding:
                35px 0;

            margin:
                0 auto;

            text-align:
                center;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {

            margin:
                0;

            font-size:
                clamp(28px, 5vw, 44px);

            font-weight:
                700;

            letter-spacing:
                -1.5px;
        }


        /* =====================================================
           SUBTITLE
        ===================================================== */

        .subtitle {

            margin-top:
                8px;

            font-size:
                16px;

            color:
                #bdbdbd;

            transition:
                color .4s ease;
        }


        body.light-mode
        .subtitle {

            color:
                #666;
        }


        /* =====================================================
           MAIN FRAME
        ===================================================== */

        .stage {

            position:
                relative;

            width:
                100%;

            /*
                Frame aspect ratio is fixed.

                The frame itself will NOT resize
                when the card is zoomed.
            */

            aspect-ratio:
                16 / 10;

            margin-top:
                28px;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow:
                hidden;

            border-radius:
                24px;

            background:
                radial-gradient(
                    circle at center,
                    #333 0%,
                    #202020 60%,
                    #111 100%
                );

            border:
                1px solid #3a3a3a;

            cursor:
                grab;

            touch-action:
                none;

            user-select:
                none;

            isolation:
                isolate;

            transition:
                background .4s ease,
                border-color .4s ease;
        }


        /* =====================================================
           LIGHT MODE FRAME
        ===================================================== */

        body.light-mode
        .stage {

            background:
                radial-gradient(
                    circle at center,
                    #ffffff 0%,
                    #e9e9eb 60%,
                    #d7d8dc 100%
                );

            border-color:
                #d0d0d4;
        }


        .stage:active {

            cursor:
                grabbing;
        }


        /* =====================================================
           DRAG INSTRUCTION
        ===================================================== */

        .instruction {

            position:
                absolute;

            top:
                18px;

            left:
                50%;

            transform:
                translateX(-50%);

            padding:
                9px 18px;

            background:
                rgba(0,0,0,.65);

            border:
                1px solid
                rgba(255,255,255,.15);

            border-radius:
                30px;

            font-size:
                13px;

            color:
                #fff;

            pointer-events:
                none;

            white-space:
                nowrap;

            z-index:
                100;

            opacity:
                1;

            /*
                Show for 10 seconds,
                then fade out.
            */

            animation:
                fadeInstruction 2s ease forwards;

            animation-delay:
                10s;
        }


        body.light-mode
        .instruction {

            background:
                rgba(255,255,255,.9);

            color:
                #444;

            border-color:
                #ddd;
        }


        @keyframes fadeInstruction {

            from {
                opacity:
                    1;
            }

            to {
                opacity:
                    0;
            }

        }


        /* =====================================================
           CARD WRAPPER
        ===================================================== */

        .card-wrapper {

            /*
                Photocard size.
            */

            width:
                min(390px, 34%);

            aspect-ratio:
                3 / 4;

            perspective:
                1400px;

            transform-style:
                preserve-3d;

            flex-shrink:
                0;

            transform:
                translate3d(
                    0,
                    0,
                    0
                );

            will-change:
                transform;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            position:
                relative;

            width:
                100%;

            height:
                100%;

            border-radius:
                16px;

            overflow:
                hidden;

            transform-style:
                preserve-3d;

            background:
                #222;

            box-shadow:

                0 40px 80px
                rgba(0,0,0,.45),

                0 10px 25px
                rgba(0,0,0,.25);

            will-change:
                transform;
        }


        /* =====================================================
           IMAGE LAYERS
        ===================================================== */

        .layer {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            backface-visibility:
                hidden;

            pointer-events:
                none;

            user-select:
                none;

            will-change:
                opacity,
                transform;
        }


        /* =====================================================
           PHOTO A
        ===================================================== */

        .layer-a {

            z-index:
                2;

            opacity:
                1;

            transform:
                translateZ(8px);
        }


        /* =====================================================
           PHOTO B
        ===================================================== */

        .layer-b {

            z-index:
                1;

            opacity:
                0;

            transform:
                translateZ(5px);
        }


        /* =====================================================
           LENTICULAR RIDGES
        ===================================================== */

        .ridges {

            position:
                absolute;

            inset:
                0;

            z-index:
                20;

            pointer-events:
                none;

            background:

                repeating-linear-gradient(
                    90deg,

                    rgba(255,255,255,.10)
                    0px,

                    rgba(255,255,255,.10)
                    1px,

                    transparent
                    1px,

                    transparent
                    5px
                );

            mix-blend-mode:
                overlay;
        }


        /* =====================================================
           LIGHT REFLECTION
        ===================================================== */

        .shine {

            position:
                absolute;

            width:
                160%;

            height:
                160%;

            left:
                -30%;

            top:
                -30%;

            z-index:
                30;

            pointer-events:
                none;

            background:

                linear-gradient(
                    115deg,

                    transparent 35%,

                    rgba(255,255,255,.45)
                    48%,

                    rgba(255,255,255,.08)
                    53%,

                    transparent 65%
                );

            mix-blend-mode:
                screen;

            transform:
                translateX(-30%);
        }


        /* =====================================================
           CONTROLS
        ===================================================== */

        .controls {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                10px;

            flex-wrap:
                wrap;

            margin-top:
                18px;
        }


        .controls button {

            border:
                1px solid #444;

            background:
                #222;

            color:
                white;

            padding:
                11px 20px;

            border-radius:
                10px;

            font-size:
                14px;

            cursor:
                pointer;

            min-height:
                42px;

            transition:
                background .2s ease,
                border-color .2s ease,
                color .2s ease,
                transform .1s ease;
        }


        .controls button:hover {

            background:
                #303030;
        }


        .controls button:active {

            transform:
                scale(.97);
        }


        /* =====================================================
           LIGHT MODE BUTTONS
        ===================================================== */

        body.light-mode
        .controls button {

            background:
                white;

            color:
                #222;

            border-color:
                #d3d3d3;
        }


        body.light-mode
        .controls button:hover {

            background:
                #f3f3f3;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .container {

                width:
                    94vw;

                padding:
                    25px 0;
            }


            .stage {

                aspect-ratio:
                    4 / 3;

                margin-top:
                    22px;

                border-radius:
                    18px;
            }


            .card-wrapper {

                width:
                    55%;
            }


            .instruction {

                font-size:
                    11px;

                padding:
                    7px 13px;
            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            .instruction {

                animation:
                    none;

                opacity:
                    1;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CONTAINER
    ===================================================== -->

    <div
        class="container"
        id="mainContainer"
    >


        <!-- =================================================
             TITLE
        ================================================= -->

        <h1>
            Here lies your Wife
        </h1>


        <!-- =================================================
             SUBTITLE
        ================================================= -->

        <div class="subtitle">
            I hope you like it ;)
        </div>


        <!-- =================================================
             MAIN FRAME
        ================================================= -->

        <div
            class="stage"
            id="stage"
        >


            <!-- =============================================
                 INSTRUCTION
            ============================================== -->

            <div
                class="instruction"
            >
                drag to interact
            </div>


            <!-- =============================================
                 PHOTOCARD
            ============================================== -->

            <div
                class="card-wrapper"
                id="cardWrapper"
            >


                <div
                    class="card"
                    id="card"
                >


                    <!-- =====================================
                         PHOTO A

                         IMPORTANT:
                         Filename exactly matches GitHub:
                         foto_A.PNG
                    ====================================== -->

                    <img
                        src="foto_A.PNG"
                        class="layer layer-a"
                        id="layerA"
                        alt="Photo A"
                        draggable="false"
                    >


                    <!-- =====================================
                         PHOTO B

                         IMPORTANT:
                         Filename exactly matches GitHub:
                         foto_B.PNG
                    ====================================== -->

                    <img
                        src="foto_B.PNG"
                        class="layer layer-b"
                        id="layerB"
                        alt="Photo B"
                        draggable="false"
                    >


                    <!-- =====================================
                         LENTICULAR RIDGES
                    ====================================== -->

                    <div
                        class="ridges"
                    ></div>


                    <!-- =====================================
                         LIGHT REFLECTION
                    ====================================== -->

                    <div
                        class="shine"
                        id="shine"
                    ></div>


                </div>

            </div>


        </div>


        <!-- =================================================
             CONTROLS
        ================================================= -->

        <div
            class="controls"
        >


            <!-- =============================================
                 RESET
            ============================================== -->

            <button
                type="button"
                id="reset"
            >
                ↺ Reset
            </button>


            <!-- =============================================
                 AUTO ROTATE
            ============================================== -->

            <button
                type="button"
                id="autoRotate"
            >
                ↻ Auto Rotate
            </button>


            <!-- =============================================
                 LIGHT / DARK MODE
            ============================================== -->

            <button
                type="button"
                id="themeButton"
            >
                make light mode
            </button>


        </div>


    </div>



    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const stage =
            document.getElementById(
                "stage"
            );


        const cardWrapper =
            document.getElementById(
                "cardWrapper"
            );


        const card =
            document.getElementById(
                "card"
            );


        const layerA =
            document.getElementById(
                "layerA"
            );


        const layerB =
            document.getElementById(
                "layerB"
            );


        const shine =
            document.getElementById(
                "shine"
            );


        const resetButton =
            document.getElementById(
                "reset"
            );


        const autoButton =
            document.getElementById(
                "autoRotate"
            );


        const themeButton =
            document.getElementById(
                "themeButton"
            );


        /* =====================================================
           ROTATION
        ===================================================== */

        let yaw =
            0;


        let pitch =
            0;


        /* =====================================================
           POSITION
        ===================================================== */

        let positionX =
            0;


        let positionY =
            0;


        /* =====================================================
           ZOOM
        ===================================================== */

        let zoom =
            1;


        const MIN_ZOOM =
            0.60;


        const MAX_ZOOM =
            1.80;


        /* =====================================================
           POINTER STATE
        ===================================================== */

        let dragging =
            false;


        let moving =
            false;


        let lastX =
            0;


        let lastY =
            0;


        /* =====================================================
           AUTO ROTATE STATE
        ===================================================== */

        let autoRotate =
            false;


        let animationFrame =
            null;


        let autoStartTime =
            null;


        /*
            One full cycle:

            +45°
              ↓
            -45°
              ↓
            +45°

            Duration:
            10 seconds.
        */

        const AUTO_CYCLE =
            10000;


        /* =====================================================
           CLAMP FUNCTION
        ===================================================== */

        function clamp(
            value,
            min,
            max
        ) {

            return Math.max(
                min,
                Math.min(
                    max,
                    value
                )
            );

        }


        /* =====================================================
           RENDER
        ===================================================== */

        function render() {


            /* =============================================
               ROTATION LIMIT
            ============================================== */

            yaw =
                clamp(
                    yaw,
                    -45,
                    45
                );


            pitch =
                clamp(
                    pitch,
                    -30,
                    30
                );


            /* =============================================
               POSITION
            ============================================== */

            cardWrapper.style.transform =

                `
                translate3d(
                    ${positionX}px,
                    ${positionY}px,
                    0
                )
                `;


            /* =============================================
               CARD ROTATION + ZOOM
            ============================================== */

            card.style.transform =

                `
                rotateX(${-pitch}deg)
                rotateY(${yaw}deg)
                scale(${zoom})
                `;


            /* =============================================
               PHOTO TRANSITION
            ============================================== */

            /*
                Left side:
                Photo A dominates.
            */

            if (
                yaw <= 0
            ) {


                layerA.style.opacity =
                    1;


                layerB.style.opacity =

                    clamp(
                        Math.abs(yaw) / 28,
                        0,
                        1
                    );

            }


            /*
                Right side:
                Photo B dominates.
            */

            else {


                layerB.style.opacity =
                    1;


                layerA.style.opacity =

                    clamp(
                        1 -
                        yaw / 28,
                        0,
                        1
                    );

            }


            /* =============================================
               3D DEPTH
            ============================================== */

            const depthA =

                7 +
                (
                    (yaw + 45) /
                    90
                ) * 7;


            const depthB =

                5 +
                (
                    (45 - yaw) /
                    90
                ) * 7;


            layerA.style.transform =

                `
                translateZ(
                    ${depthA}px
                )
                `;


            layerB.style.transform =

                `
                translateZ(
                    ${depthB}px
                )
                `;


            /* =============================================
               LIGHT REFLECTION
            ============================================== */

            shine.style.transform =

                `
                translateX(
                    ${yaw * 1.7}%
                )

                translateY(
                    ${pitch * .5}%
                )

                rotate(8deg)
                `;

        }


        /* =====================================================
           LEFT CLICK + DRAG
           = ROTATE
        ===================================================== */

        stage.addEventListener(
            "pointerdown",
            function(event) {


                /*
                    Only left mouse button.
                */

                if (
                    event.button !== 0
                ) {

                    return;

                }


                dragging =
                    true;


                moving =
                    false;


                lastX =
                    event.clientX;


                lastY =
                    event.clientY;


                stage.setPointerCapture(
                    event.pointerId
                );


                event.preventDefault();

            }
        );


        /* =====================================================
           RIGHT CLICK + DRAG
           = MOVE
        ===================================================== */

        stage.addEventListener(
            "pointerdown",
            function(event) {


                /*
                    Only right mouse button.
                */

                if (
                    event.button !== 2
                ) {

                    return;

                }


                moving =
                    true;


                dragging =
                    false;


                lastX =
                    event.clientX;


                lastY =
                    event.clientY;


                stage.setPointerCapture(
                    event.pointerId
                );


                event.preventDefault();

            }
        );


        /* =====================================================
           POINTER MOVE
        ===================================================== */

        stage.addEventListener(
            "pointermove",
            function(event) {


                /* =============================================
                   LEFT DRAG = ROTATE
                ============================================== */

                if (
                    dragging
                ) {


                    const deltaX =

                        event.clientX -
                        lastX;


                    const deltaY =

                        event.clientY -
                        lastY;


                    lastX =
                        event.clientX;


                    lastY =
                        event.clientY;


                    /*
                        Horizontal movement:
                        Y axis rotation.
                    */

                    yaw +=
                        deltaX * .45;


                    /*
                        Vertical movement:
                        X axis rotation.
                    */

                    pitch -=
                        deltaY * .35;


                    render();

                }


                /* =============================================
                   RIGHT DRAG = MOVE
                ============================================== */

                if (
                    moving
                ) {


                    const deltaX =

                        event.clientX -
                        lastX;


                    const deltaY =

                        event.clientY -
                        lastY;


                    lastX =
                        event.clientX;


                    lastY =
                        event.clientY;


                    positionX +=
                        deltaX;


                    positionY +=
                        deltaY;


                    /*
                        Movement limits.
                    */

                    positionX =
                        clamp(
                            positionX,
                            -500,
                            500
                        );


                    positionY =
                        clamp(
                            positionY,
                            -500,
                            500
                        );


                    render();

                }

            }
        );


        /* =====================================================
           POINTER UP
        ===================================================== */

        function stopPointer() {

            dragging =
                false;


            moving =
                false;

        }


        stage.addEventListener(
            "pointerup",
            stopPointer
        );


        stage.addEventListener(
            "pointercancel",
            stopPointer
        );


        /* =====================================================
           DISABLE RIGHT CLICK MENU
        ===================================================== */

        stage.addEventListener(
            "contextmenu",
            function(event) {

                event.preventDefault();

            }
        );


        /* =====================================================
           SCROLL = ZOOM
        ===================================================== */

        stage.addEventListener(
            "wheel",
            function(event) {


                /*
                    Stop page scrolling while
                    interacting with the card.
                */

                event.preventDefault();


                /*
                    Scroll up = zoom in.
                */

                if (
                    event.deltaY < 0
                ) {

                    zoom +=
                        0.05;

                }


                /*
                    Scroll down = zoom out.
                */

                else {

                    zoom -=
                        0.05;

                }


                /*
                    Limit zoom.
                */

                zoom =
                    clamp(
                        zoom,
                        MIN_ZOOM,
                        MAX_ZOOM
                    );


                render();

            },
            {
                passive:
                    false
            }
        );


        /* =====================================================
           RESET
        ===================================================== */

        resetButton.addEventListener(
            "click",
            function() {


                yaw =
                    0;


                pitch =
                    0;


                zoom =
                    1;


                positionX =
                    0;


                positionY =
                    0;


                render();

            }
        );


        /* =====================================================
           AUTO ROTATE BUTTON
        ===================================================== */

        autoButton.addEventListener(
            "click",
            function() {


                autoRotate =
                    !autoRotate;


                /* =============================================
                   START
                ============================================== */

                if (
                    autoRotate
                ) {


                    autoButton.textContent =
                        "■ Stop Auto Rotate";


                    /*
                        Begin from +45°.
                    */

                    yaw =
                        45;


                    autoStartTime =
                        performance.now();


                    animateAutoRotate();

                }


                /* =============================================
                   STOP
                ============================================== */

                else {


                    autoButton.textContent =
                        "↻ Auto Rotate";


                    cancelAnimationFrame(
                        animationFrame
                    );


                    animationFrame =
                        null;


                    autoStartTime =
                        null;

                }

            }
        );


        /* =====================================================
           AUTO ROTATE ANIMATION
        =====================================================

           Movement:

           +45°
             ↓
           -45°
             ↓
           +45°

           One complete cycle:
           10 seconds.
        ===================================================== */

        function animateAutoRotate(
            timestamp
        ) {


            if (
                !autoRotate
            ) {

                return;

            }


            /*
                Initialize timer.
            */

            if (
                autoStartTime === null
            ) {

                autoStartTime =
                    timestamp ||
                    performance.now();

            }


            const now =

                timestamp ||
                performance.now();


            /*
                Time elapsed.
            */

            const elapsed =

                (
                    now -
                    autoStartTime
                ) %
                AUTO_CYCLE;


            /*
                Convert to 0 → 1.
            */

            const progress =

                elapsed /
                AUTO_CYCLE;


            /*
                Cosine wave:

                +45 → -45 → +45

                Smooth acceleration and
                deceleration.
            */

            yaw =

                Math.cos(
                    progress *
                    Math.PI *
                    2
                ) * 45;


            render();


            animationFrame =

                requestAnimationFrame(
                    animateAutoRotate
                );

        }


        /* =====================================================
           LIGHT / DARK MODE
        ===================================================== */

        themeButton.addEventListener(
            "click",
            function() {


                /*
                    Toggle light mode.
                */

                const lightMode =

                    document.body.classList.toggle(
                        "light-mode"
                    );


                /*
                    Update button text.
                */

                if (
                    lightMode
                ) {

                    themeButton.textContent =
                        "make dark mode";

                }

                else {

                    themeButton.textContent =
                        "make light mode";

                }

            }
        );


        /* =====================================================
           INITIAL STATE
        ===================================================== */

        /*
            Start in DARK MODE.
        */

        document.body.classList.remove(
            "light-mode"
        );


        themeButton.textContent =
            "make light mode";


        /*
            Initial render.
        */

        render();

    </script>

</body>

</html>
